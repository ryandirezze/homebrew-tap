name: Auto-bump cask

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Update cask from latest NovaCAD release
        run: ./scripts/auto-bump.sh

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "Cask is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/novacad.rb
          git commit -m "Auto-bump novacad cask to latest NovaCAD release"
          git push
